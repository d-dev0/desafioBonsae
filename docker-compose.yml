version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: residencia_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: residencia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: residencia_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: residencia_api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      STORAGE_DIR: ./storage
      QUEUE_NAME: report-generation
      JOB_CONCURRENCY: 4
      JOB_TIMEOUT_MS: 600000
      JOB_ATTEMPTS: 3
      JOB_BACKOFF_MS: 15000
      PUBLIC_BASE_URL: http://localhost:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: residencia
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
      - ./storage:/app/storage

volumes:
  postgres_data:
